<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diseñador de Redes GPON</title>
  
  <!-- Estilos de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React y React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel para procesar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- React Flow y sus estilos -->
  <script src="https://cdn.jsdelivr.net/npm/@xyflow/react@12/dist/umd/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12/dist/style.css" />

  <style>
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;
    const { ReactFlow, Background, Controls, MiniMap, addEdge, applyNodeChanges, applyEdgeChanges } = XYFlow;

    // Nodos iniciales con la topología GPON básica
    const initialNodes = [
      {
        id: 'olt-1',
        type: 'default',
        data: { label: '🏢 OLT Central (Puerto PON 1)' },
        position: { x: 100, y: 200 },
        style: { background: '#1e293b', color: '#38bdf8', border: '2px solid #0284c7', borderRadius: '8px', padding: '10px' }
      },
      {
        id: 'splitter-1',
        type: 'default',
        data: { label: '🔀 Splitter Primer Nivel (1:8)' },
        position: { x: 450, y: 200 },
        style: { background: '#1e293b', color: '#facc15', border: '2px solid #ca8a04', borderRadius: '8px', padding: '10px' }
      },
      {
        id: 'nap-1',
        type: 'default',
        data: { label: '📦 Caja NAP 01 (8 Hilos)' },
        position: { x: 800, y: 200 },
        style: { background: '#1e293b', color: '#4ade80', border: '2px solid #16a34a', borderRadius: '8px', padding: '10px' }
      }
    ];

    // Conexiones iniciales de fibra óptica
    const initialEdges = [
      { id: 'e1-2', source: 'olt-1', target: 'splitter-1', animated: true, label: 'Fibra Troncal (-18 dBm)', style: { stroke: '#0284c7', strokeWidth: 3 } },
      { id: 'e2-3', source: 'splitter-1', target: 'nap-1', animated: true, label: 'Distribución', style: { stroke: '#ca8a04', strokeWidth: 2 } }
    ];

    function App() {
      const [nodes, setNodes] = useState(initialNodes);
      const [edges, setEdges] = useState(initialEdges);

      const onNodesChange = useCallback(
        (changes) => setNodes((nds) => applyNodeChanges(changes, nds)),
        []
      );
      const onEdgesChange = useCallback(
        (changes) => setEdges((eds) => applyEdgeChanges(changes, eds)),
        []
      );
      const onConnect = useCallback(
        (params) => setEdges((eds) => addEdge({ ...params, animated: true, style: { stroke: '#4ade80', strokeWidth: 2 } }, eds)),
        []
      );

      return (
        <div className="w-full h-screen flex flex-col">
          <!-- Barra superior -->
          <header className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
            <h1 className="text-xl font-bold text-sky-400">GPON Network Designer</h1>
            <span className="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">Modo Prototipo</span>
          </header>

          <!-- Lienzo interactivo de React Flow -->
          <div className="flex-1 w-full h-full">
            <ReactFlow
              nodes={nodes}
              edges={edges}
              onNodesChange={onNodesChange}
              onEdgesChange={onEdgesChange}
              onConnect={onConnect}
              fitView
            >
              <Background color="#334155" gap={16} />
              <Controls />
              <MiniMap nodeColor="#0284c7" maskColor="rgba(15, 23, 42, 0.7)" />
            </ReactFlow>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
