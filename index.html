<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diseñador de Redes GPON</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .node {
      position: absolute;
      cursor: move;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-white w-screen h-screen overflow-hidden flex flex-col font-sans">

  <!-- Barra Superior -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center z-10">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🌐</span>
      <h1 class="text-xl font-bold text-sky-400">Diseñador GPON Interactive</h1>
    </div>
    <div class="space-x-2">
      <button onclick="addNode('Splitter 1:8', '#ca8a04')" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
        + Splitter 1:8
      </button>
      <button onclick="addNode('Caja NAP', '#16a34a')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
        + Caja NAP
      </button>
    </div>
  </header>

  <!-- Lienzo de Dibujo -->
  <div id="canvas" class="flex-1 relative w-full h-full bg-slate-950 overflow-hidden">
    
    <!-- SVG para las líneas de fibra óptica -->
    <svg id="svg-connections" class="absolute inset-0 w-full h-full pointer-events-none z-0">
      <line id="fiber-line" x1="220" y1="230" x2="480" y2="230" stroke="#0284c7" stroke-width="4" stroke-dasharray="6" />
    </svg>

    <!-- Nodo OLT -->
    <div id="olt" class="node z-10 bg-slate-800 border-2 border-sky-500 rounded-xl p-4 w-52 shadow-lg shadow-sky-950" style="left: 50px; top: 180px;">
      <div class="flex items-center space-x-2 border-b border-slate-700 pb-2 mb-2">
        <span class="text-xl">🏢</span>
        <h3 class="font-bold text-sky-400 text-sm">OLT Central</h3>
      </div>
      <p class="text-xs text-slate-400">Puerto PON 1</p>
      <p class="text-xs text-emerald-400 font-mono mt-1">Potencia: +2.5 dBm</p>
    </div>

    <!-- Nodo Splitter -->
    <div id="splitter" class="node z-10 bg-slate-800 border-2 border-amber-500 rounded-xl p-4 w-52 shadow-lg shadow-amber-950" style="left: 480px; top: 180px;">
      <div class="flex items-center space-x-2 border-b border-slate-700 pb-2 mb-2">
        <span class="text-xl">🔀</span>
        <h3 class="font-bold text-amber-400 text-sm">Splitter 1:8</h3>
      </div>
      <p class="text-xs text-slate-400">Nivel 1 (Atenuación 10.5 dB)</p>
      <p class="text-xs text-amber-300 font-mono mt-1">Salida: -8.0 dBm</p>
    </div>

  </div>

  <script>
    // Lógica para hacer los elementos arrastrables dentro del canvas
    function makeDraggable(element) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      element.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e = e || window.event;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";
        updateFiber();
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    // Actualiza la posición de la línea de fibra en tiempo real
    function updateFiber() {
      const olt = document.getElementById('olt');
      const splitter = document.getElementById('splitter');
      const line = document.getElementById('fiber-line');

      if (olt && splitter && line) {
        line.setAttribute('x1', olt.offsetLeft + 208);
        line.setAttribute('y1', olt.offsetTop + 50);
        line.setAttribute('x2', splitter.offsetLeft);
        line.setAttribute('y2', splitter.offsetTop + 50);
      }
    }

    // Inicializar arrastre
    makeDraggable(document.getElementById('olt'));
    makeDraggable(document.getElementById('splitter'));

    // Agregar nuevos nodos al lienzo
    function addNode(title, color) {
      const canvas = document.getElementById('canvas');
      const div = document.createElement('div');
      div.className = 'node z-10 bg-slate-800 border-2 rounded-xl p-4 w-52 shadow-lg';
      div.style.borderColor = color;
      div.style.left = '250px';
      div.style.top = '300px';
      div.innerHTML = `
        <div class="flex items-center space-x-2 border-b border-slate-700 pb-2 mb-2">
          <span class="text-xl">📦</span>
          <h3 class="font-bold text-sm text-white">${title}</h3>
        </div>
        <p class="text-xs text-slate-400">Elemento de Distribución</p>
      `;
      canvas.appendChild(div);
      makeDraggable(div);
    }
  </script>
</body>
</html>
